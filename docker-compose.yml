version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: logiguay_postgres
    restart: unless-stopped
    networks:
      - logiguay
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logiguay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiguay_pass}
      POSTGRES_DB: ${POSTGRES_DB:-logiguay_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-logiguay}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logiguay_redis
    restart: unless-stopped
    networks:
      - logiguay
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logiguay_pgadmin
    restart: unless-stopped
    networks:
      - logiguay
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@logiguay.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

networks:
  logiguay:
    driver: bridge
