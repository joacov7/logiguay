services:
  postgres:
    image: postgres:16-alpine
    container_name: logiguay_postgres
    restart: unless-stopped
    networks:
      - logiguay
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logiguay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logiguay_pass}
      POSTGRES_DB: ${POSTGRES_DB:-logiguay_db}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-logiguay}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logiguay_redis
    restart: unless-stopped
    networks:
      - logiguay
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: logiguay_api
    restart: unless-stopped
    networks:
      - logiguay
    env_file: .env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    container_name: logiguay_web
    restart: unless-stopped
    networks:
      - logiguay
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      - api

  traccar:
    image: traccar/traccar:6-alpine
    container_name: logiguay_traccar
    restart: unless-stopped
    networks:
      - logiguay
    environment:
      FORWARD_ENABLE: 'true'
      FORWARD_URL: 'http://api:3001/api/v1/tracking/traccar?token=${TRACCAR_WEBHOOK_TOKEN:-traccar_secret_token}'
      FORWARD_JSON: 'true'
    ports:
      - '8083:8082'
      - '5023:5023'
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - traccar_data:/opt/traccar/data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  traccar_data:

networks:
  logiguay:
    driver: bridge
